[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v --tb=short --strict-markers --disable-warnings -ra

markers =
    unit: Unit tests that don't require external dependencies
    integration: Integration tests that may require mocked external services
    error_scenarios: Error handling and recovery tests
    slow: Tests that take longer to run
    config: Configuration validation tests
    chunking: Message chunking logic tests
    mqtt: MQTT manager and caching tests
    meshtastic: Meshtastic device interaction tests
    filtering: ID filtering behavior tests
